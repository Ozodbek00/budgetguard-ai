# Local run of both surfaces:
#   docker compose up --build
#     Blazor UI  -> http://localhost:8080
#     Swagger API -> http://localhost:8081/swagger
#
# There are deliberately no container healthchecks here. The mcr.microsoft.com
# dotnet/aspnet runtime image ships neither curl nor wget, so the usual
# `wget -qO- /health` probe fails and reports a perfectly healthy service as
# unhealthy — which is worse than no probe. Installing curl purely to satisfy a
# local convenience check is not worth the image size or the attack surface.
# Both `/health` endpoints work and are probed externally where it matters:
# render.yaml uses `healthCheckPath`, fly.toml uses an [[http_service.checks]]
# block, and CI curls the endpoint from the runner. Check manually with:
#   curl http://localhost:8080/health
#
# Each service gets its OWN database volume. That is deliberate: SQLite
# serialises writers with file locks, and pointing two independently scaled
# containers at one file invites lock contention for no benefit here. The two
# surfaces are alternative front ends over the same engine, not two halves of
# one system — the Blazor app talks to the Application layer in-process and
# never calls the API. See docs/adr/0003-blazor-server-over-spa.md.

services:
  web:
    build:
      context: .
      dockerfile: src/BudgetGuard.Web/Dockerfile
    image: budgetguard-web:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BudgetGuard: "Data Source=/app/data/budgetguard.db"
    volumes:
      - web-data:/app/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/BudgetGuard.Api/Dockerfile
    image: budgetguard-api:local
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BudgetGuard: "Data Source=/app/data/budgetguard.db"
    volumes:
      - api-data:/app/data
    restart: unless-stopped

volumes:
  web-data:
  api-data:
